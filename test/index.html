<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
   <style>
       /* ================= BUTTON ================= */
       .Button-Mobile{
           cursor: pointer;
       }

       /* ================= OVERLAY ================= */
       .Overlay{
           position: fixed;
           inset: 0;
           background: rgba(0,0,0,0.6);
           opacity: 0;
           visibility: hidden;
           transition: 0.3s;
           z-index: 998;
       }

       /* ================= MENU ================= */
       .Container-List-Menu-Mobile{
           position: fixed;
           top: 0;
           right: -100%;
           width: 80%;
           max-width: 320px;
           height: 100vh;
           background: #0F0F0F;
           padding: 24px;
           transition: 0.35s ease;
           z-index: 999;
           display: flex;
           flex-direction: column;
       }

       /* ================= MENU TOP ================= */
       .Mobile-Top{
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin-bottom: 32px;
       }

       .Times{
           font-size: 32px;
           cursor: pointer;
       }

       /* ================= MENU LIST ================= */
       .List-Menu-Mobile{
           display: flex;
           flex-direction: column;
           gap: 20px;
       }

       .List-Menu-Mobile a{
           color: #FFFFFF;
           font-size: 18px;
           font-weight: 600;
           display: flex;
           align-items: center;
           gap: 10px;
       }

       /* ================= CHECKBOX ACTION ================= */
       #Menu-Mobile:checked ~ .Overlay{
           opacity: 1;
           visibility: visible;
       }

       #Menu-Mobile:checked ~ .Container-List-Menu-Mobile{
           right: 0;
       }

   </style>
</head>
<body>
<!-- CHECKBOX CONTROL -->
<input type="checkbox" id="Menu-Mobile" hidden>

<!-- HEADER MOBILE -->
<div class="Responsive-Mobile">
    <a href="#">
        <img src="/Products-Page/icons/Header/Logo.svg" alt="Logo" width="130">
    </a>

    <!-- BUTTON OPEN MENU -->
    <label for="Menu-Mobile" class="Button-Mobile">
        <img src="/Products-Page/icons/Header/Button-Mobile.svg" alt="Button Mobile" width="28" height="28">
    </label>
</div>

<!-- OVERLAY -->
<label for="Menu-Mobile" class="Overlay"></label>

<!-- MENU MOBILE -->
<div class="Container-List-Menu-Mobile">

    <div class="Mobile-Top">
        <img src="/Products-Page/icons/Header/Logo.svg" alt="Logo">
        <!-- BUTTON CLOSE -->
        <label for="Menu-Mobile" class="Times">&times;</label>
    </div>

    <nav class="List-Menu-Mobile">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">
            <img src="/Products-Page/icons/Header/Cart-Mobile.svg" alt="Cart Icon">
            <span>Cart</span>
        </a>
        <a href="#">Contact</a>
    </nav>

</div>

</body>
</html>
